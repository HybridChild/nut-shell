[package]
name = "native_examples"
version = "0.1.0"
edition = "2024"
authors = ["Esben Dueholm Nørgaard"]

[dependencies]
# Nut-shell library (parent crate)
nut-shell = { path = "../..", default-features = false }

# Utilities
heapless = "0.9"

# Terminal control for raw mode (native examples only)
crossterm = "0.29"

# Async runtime (for async example)
tokio = { version = "1.49.0", features = ["rt-multi-thread", "time", "macros"] }

[features]

# Import features from nut-shell for pass through
authentication = ["nut-shell/authentication"]
completion = ["nut-shell/completion"]
history = ["nut-shell/history"]
async = ["nut-shell/async"]
context-path = ["nut-shell/context-path"]

default = ["completion", "history"]

[[bin]]
name = "basic"
path = "bin/basic/main.rs"

[[bin]]
name = "async"
path = "bin/async/main.rs"
required-features = ["async"]

[[bin]]
name = "context-path"
path = "bin/context-path/main.rs"
required-features = ["context-path"]

[profile.release]
debug = true
lto = true
opt-level = "z"
